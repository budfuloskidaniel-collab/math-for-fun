<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Math for Fun</title>

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3fa9d9;font-family:"Nunito","Avenir Next Rounded","Arial Rounded MT Bold","Avenir Next","Trebuchet MS",sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.hud{position:fixed;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap}

.pill{background:#fff8e7;border-radius:999px;padding:7px 14px;font-weight:800;color:#7a5a32;font-size:15px;box-shadow:0 3px 0 #e2cfa6,0 6px 14px rgba(0,0,0,.15);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:20px;height:20px}
#clock{flex-direction:column;align-items:flex-start;gap:0;line-height:1.1;border-radius:22px;padding:6px 16px}
#clock b{font-size:22px;color:#4a8a5a}#clock small{font-size:12px;color:#a08050}
.bar{display:inline-block;width:110px;height:12px;background:#efe3c8;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ed957,#ffd25e);border-radius:6px}
.ready{animation:pulse 1s infinite}@keyframes pulse{50%{background:#ffe08a}}
.btn{cursor:pointer;background:#fff;border:none;border-radius:999px;padding:9px 16px;margin:4px;font-size:16px;font-weight:800;color:#7a5a32;font-family:inherit;box-shadow:0 3px 0 #e2cfa6;transition:transform .08s}
.btn:hover{transform:translateY(-1px) scale(1.03)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e2cfa6}
.btn:focus-visible{outline:3px solid #3fbfa8}
.btn.g{background:#c8f2b8;box-shadow:0 3px 0 #8fcf7a}.btn.b{background:#cfe8ff;box-shadow:0 3px 0 #8fbfe8}.btn.r{background:#ffd0d0;box-shadow:0 3px 0 #e8a0a0}.btn.y{background:#ffe9a0;box-shadow:0 3px 0 #e8c860}
.btn:disabled{opacity:.5;cursor:default;transform:none}
#dlg{position:fixed;z-index:10;display:none;color:#6b4f2a}
#dlg.speech{left:50%;bottom:18px;transform:translateX(-50%);width:min(880px,95vw);max-height:86vh;overflow:auto;background:#fff8e7;border-radius:48px/42px;padding:30px 36px 16px;box-shadow:0 6px 0 #ead7b0,0 14px 34px rgba(0,0,0,.25);animation:pop .22s ease-out}
#dlg .body{max-height:62vh;overflow:auto}
#dlg .tag{position:absolute;top:-17px;left:44px;padding:6px 22px;border-radius:999px;color:#fff;font-weight:900;font-size:18px;transform:rotate(-4deg);box-shadow:0 3px 0 rgba(0,0,0,.15);text-shadow:0 1px 0 rgba(0,0,0,.2)}
#dlg .tag .h{font-size:13px;letter-spacing:1px;margin-left:6px;color:#ffe0ea}
.txt{font-size:21px;line-height:1.45;min-height:1.5em;font-weight:700;white-space:pre-line}
.extra{opacity:0;transition:opacity .25s;pointer-events:none}.extra.show{opacity:1;pointer-events:auto}
.more{position:absolute;right:34px;bottom:10px;color:#e8a040;animation:bounce .6s infinite alternate;font-size:18px}
@keyframes bounce{to{transform:translateY(4px)}}
#dlg.panel{left:50%;top:50%;transform:translate(-50%,-50%);width:min(840px,95vw);max-height:90vh;overflow:auto;background:#fff8e7;border-radius:32px;padding:22px 26px;box-shadow:0 8px 0 #ead7b0,0 16px 44px rgba(0,0,0,.3);animation:pop2 .22s ease-out}
#dlg.phone{left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#fff4fb,#e4fff4);border-radius:46px;border:10px solid #fff;padding:18px 18px 22px;box-shadow:0 10px 0 #e6d8f0,0 20px 50px rgba(0,0,0,.35);animation:pop2 .22s ease-out}
.phone h3{text-align:center}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:10px 4px}
.app{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px;cursor:pointer;gap:5px}
.app .ic{width:74px;height:74px;border-radius:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .1s}
.app:hover .ic{transform:scale(1.07) rotate(-3deg)}.app svg{width:42px;height:42px}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}
@keyframes pop2{from{transform:translate(-50%,-50%) scale(.9);opacity:0}}
#dlg h3{margin:0 0 8px;color:#e07a3a;font-size:22px}
#dlg input{font-size:22px;padding:7px 12px;border-radius:14px;border:3px solid #ead7b0;width:170px;font-family:inherit;background:#fff;color:#6b4f2a}
.qtext{font-size:20px;font-weight:800;background:#fff;border-radius:18px;padding:10px 14px;margin:8px 0}
.qhead{font-size:13px;font-weight:900;letter-spacing:1px;color:#a08050}
.paper{background:repeating-linear-gradient(#fff 0 22px,#d8ecff 22px 23px);border-left:5px solid #ff9a9a;border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:800}
.hint{background:#eef8ff;border-left:6px solid #7ab6e8;padding:8px 12px;border-radius:12px;margin-top:8px;white-space:pre-line;font-size:16px}
.note{background:#fff1c8;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:16px}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.item{background:#fff;border-radius:18px;padding:6px;width:118px;text-align:center;cursor:pointer;font-size:14px;font-weight:700;box-shadow:0 3px 0 #ead7b0;position:relative}
.item img{width:56px;height:56px;display:block;margin:0 auto}.item.no{opacity:.45;cursor:default}
.item .sale{position:absolute;top:-6px;right:-6px;background:#ff6a6a;color:#fff;border-radius:999px;font-size:11px;padding:2px 7px}
.item s{color:#b0a090}
.tabs{margin:4px 0 6px}
table.t{border-collapse:collapse;margin:6px 0}table.t td,table.t th{padding:4px 9px;border-bottom:1px solid #eadfbf;font-size:15px;text-align:left}.weak{background:#ffd9d9}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;margin:3px;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 0 #0002}.sw.on{border-color:#3fbfa8}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#6b4f2a;color:#fff;padding:10px 24px;border-radius:999px;font-size:19px;font-weight:800;opacity:0;transition:opacity .4s;pointer-events:none;z-index:20}
#fade{position:fixed;left:0;top:0;right:0;bottom:0;background:#1a1410;opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#help{position:fixed;bottom:6px;left:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-size:12px;z-index:4;font-weight:700}

.pad{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;max-width:440px}
.pad .btn{min-width:48px;min-height:44px;padding:8px 0;margin:0}
.gbtn{min-width:132px;min-height:72px;border-radius:22px;white-space:normal;padding:8px 10px}
.gbtn small{display:block;font-size:11px;line-height:1.25;font-weight:700}
.stick{position:sticky;bottom:0;background:#fff8e7;padding:8px 0 2px;z-index:2}
html,body{touch-action:manipulation}
#c{touch-action:none}
@media (max-width:900px){
  #help{display:none}
  .txt{font-size:18px}
  .qtext{font-size:18px}
  #dlg.speech{padding:20px 14px 12px;border-radius:28px;max-height:70vh;bottom:max(72px, calc(env(safe-area-inset-bottom) + 64px))}
  #dlg.speech .body{max-height:none;overflow:visible}
  #dlg.panel,#dlg.phone{padding:14px 12px}
  #dlg input{width:min(100%,280px);font-size:20px}
  .btn{min-height:44px}
  .pill{font-size:13px;padding:8px 10px;min-height:40px}
  .bar{width:64px}
  #hudL{top:8px;left:8px;max-width:calc(100vw - 16px);gap:4px}
  #hudR{top:auto;bottom:max(8px, env(safe-area-inset-bottom));right:8px;left:8px;justify-content:flex-end;gap:4px}
  table.t{display:block;overflow-x:auto;max-width:100%}
  .gbtn{min-width:140px;min-height:96px}
  .pad .btn{min-width:52px;min-height:48px}
}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hudL"><span class="pill" id="clock"></span><span class="pill" id="pts"></span><span class="pill" id="lvl"></span><span class="pill" id="prof" style="font-size:13px"></span></div>

<div id="help">Arrows/WASD move · Shift run · Space/Enter talk, catch, fish, shake, chop, plant · T switch tool · tap or click to walk · B bag · P phone · M sound · Progress stays on this device.</div>
<script>
var PercentLegacy=(function(){
var R=Math.random;
function rnd(a,b){return a+Math.floor(R()*(b-a+1));}
function pick(a){return a[Math.floor(R()*a.length)];}
function r2(x){return Math.round(x*100)/100;}
function money(x){x=r2(x);return "$"+(Number.isInteger(x)?x:x.toFixed(2));}

 var cands=[ans*2,ans/2,ans+10,ans-10,ans*10,ans/10,ans+5,ans-1,ans+1,100-ans];
 while(s.size<4&&tries<200){tries++;var v=r2(pick(cands)+(tries>20?rnd(-9,9):0));if(v>0&&!s.has(v))s.add(v);}
 var a=Array.from(s);a.sort(function(){return R()-.5});return a.map(function(v){return unit==="$"?money(v):unit==="%"?v+"%":String(v)});}
function genEasy(t){if(t==null)t=rnd(0,3);var q;
 if(t===0){var k=rnd(5,95);q={text:"On a 10×10 grid (100 squares), "+k+" squares are shaded. What percent is shaded?",ans:k,unit:"%",
  hint:"Percent means \"out of 100\". "+k+" out of 100 squares = "+k+"%.",v:{k:k}};}
 else if(t===1){var p=pick([50,10,25,1]),n;
  if(p===50)n=2*rnd(5,100);else if(p===10)n=10*rnd(2,50);else if(p===25)n=4*rnd(3,50);else n=100*rnd(1,9);
  var a=n*p/100,h={50:"50% is HALF. Half of "+n+" is "+a+".",10:"10% means move the decimal one place left: "+n+" → "+a+".",25:"25% is half of half (a quarter). "+n+" ÷ 4 = "+a+".",1:"1% means move the decimal two places left: "+n+" → "+a+"."}[p];
  q={text:"What is "+p+"% of "+n+"?",ans:a,unit:"",hint:h,v:{p:p,n:n}};}
 else if(t===2){var c=pick([5,10,25,35,50,75,90,15,60]);q={text:"How many cents is "+c+"% of one dollar?",ans:c,unit:"",hint:"A dollar is 100 cents, so "+c+"% of it is "+c+" out of 100 cents = "+c+" cents.",v:{c:c}};}
 else{var f=pick([[1,2,50],[1,4,25],[3,4,75],[1,10,10],[1,5,20],[2,5,40]]);q={text:"What percent is the fraction "+f[0]+"/"+f[1]+"?",ans:f[2],unit:"%",hint:"Make the bottom 100: "+f[0]+"/"+f[1]+" = "+f[2]+"/100 = "+f[2]+"%.",v:{a:f[0],b:f[1],p:f[2]}};}
 q.diff="easy";q.type="e"+t;q.options=mkOpts(q.ans,q.unit);q.correct=q.unit==="%"?q.ans+"%":String(q.ans);return q;}
function genMedium(t){if(t==null)t=rnd(0,2);var q;
 if(t===0){var p=pick([5,20,30,40,60,75,15]),n=20*rnd(1,10),a=p*n/100;
  q={text:"What is "+p+"% of "+n+"?",ans:a,hint:"Start with 10% of "+n+" = "+(n/10)+".\n"+p+"% is "+(p/10)+" × that = "+a+".\n(Or: "+n+" × "+(p/100)+" = "+a+")",v:{p:p,n:n}};}
 else if(t===1){var w,p2,part;do{w=pick([20,25,40,50,80,200,60]);p2=5*rnd(1,19);part=w*p2/100;}while(!Number.isInteger(part));
  q={text:part+" is what percent of "+w+"?",ans:p2,hint:"Part ÷ whole, then × 100:\n"+part+" ÷ "+w+" = "+(part/w)+"\n"+(part/w)+" × 100 = "+p2+"%",v:{w:w,p:p2,part:part}};}
 else{var b=20*rnd(1,8),ten=b/10,five=ten/2;
  q={text:"Your family's restaurant bill is "+money(b)+". How much is a 15% tip? (Hint: 10% + 5%)",ans:r2(ten+five),hint:"10% of "+money(b)+" = "+money(ten)+"\n5% is half of that = "+money(five)+"\n15% = "+money(ten)+" + "+money(five)+" = "+money(ten+five),v:{b:b}};}
 q.diff="medium";q.type="m"+t;return q;}
function genHard(t){if(t==null)t=rnd(0,3);var q;
 if(t===0){var p=pick([10,20,25,30,40,60,75]),W=20*rnd(2,15),part=p*W/100;
  q={text:pick(["Pip","Maple","Coco"])+" has read "+part+" pages of a book. That's "+p+"% of the book. How many pages is the whole book?",ans:W,
  hint:"Bar model: "+p+"% is "+part+" pages.\nFind 1%: "+part+" ÷ "+p+" = "+(part/p)+"\nWhole (100%): "+(part/p)+" × 100 = "+W,v:{p:p,W:W,part:part}};}
 else if(t===1){var P=20*rnd(2,10),d=pick([10,20,25,50]),tx=pick([5,10]),s=P*(100-d)/100,f=r2(s*(100+tx)/100);

  hint:"Step 1: "+d+"% of "+money(P)+" = "+money(P*d/100)+", so sale price = "+money(s)+"\nStep 2: "+tx+"% of "+money(s)+" = "+money(s*tx/100)+"\nStep 3: "+money(s)+" + "+money(s*tx/100)+" = "+money(f),v:{P:P,d:d,tx:tx}};}
 else if(t===2){var o,p3,nw,up=R()<.5;do{o=pick([20,40,50,80,200,60]);p3=5*rnd(1,up?20:18);nw=o*(up?100+p3:100-p3)/100;}while(!Number.isInteger(nw));

  hint:"Change = "+(up?nw+" − "+o:o+" − "+nw)+" = "+Math.abs(nw-o)+"\nDivide by the ORIGINAL amount: "+Math.abs(nw-o)+" ÷ "+o+" = "+(Math.abs(nw-o)/o)+"\n× 100 = "+p3+"%",v:{o:o,nw:nw,up:up,p:p3}};}
 else{var A,pa,B,off,a1,b1;do{A=20*rnd(2,8);pa=pick([10,20,25,50]);B=A+5*rnd(-3,3);off=5*rnd(1,4);a1=A*(100-pa)/100;b1=B-off;}while(a1===b1||b1<=0);
  q={text:"Store A sells a scooter for "+money(A)+" at "+pa+"% off. Store B sells it for "+money(B)+" with "+money(off)+" off. How many dollars cheaper is the better deal?",ans:r2(Math.abs(a1-b1)),
  hint:"Store A: "+pa+"% of "+money(A)+" = "+money(A*pa/100)+", price = "+money(a1)+"\nStore B: "+money(B)+" − "+money(off)+" = "+money(b1)+"\nDifference: "+money(Math.abs(a1-b1)),v:{A:A,pa:pa,B:B,off:off}};}
 q.diff="hard";q.type="h"+t;return q;}

function clueForPercent(q,tier){var t=q.text;
 if(tier===1){
  if(/grid|cents|fraction/.test(t))return "Percent means \"out of 100\". Think: how many out of 100?";
  if(q.diff==="easy")return "Benchmark tricks: 50% = half · 25% = divide by 4 · 10% = move decimal 1 place left · 1% = move decimal 2 places left.";
  if(/tip/.test(t))return "Find 10% (move the decimal), then 5% is half of that. Add them: 15% = 10% + 5%.";
  if(/what percent of/.test(t))return "percent = part ÷ whole × 100";
  if(/^What is/.test(t))return "part = percent × whole (turn the percent into a decimal, or build it from 10% pieces).";
  if(/pages/.test(t))return "Bar model: the known part is that percent of the bar. Find 1% (or 10%) first, then scale up to 100%.";
  if(/sales tax/.test(t))return "Do it in order: first take the discount off, THEN find the tax on the sale price and add it.";
  if(/fireflies/.test(t))return "percent change = (difference ÷ ORIGINAL amount) × 100";
  return "Work out each store's final price separately, then subtract the smaller from the bigger.";}
 if(q.diff==="easy"){if(/fraction/.test(t))return "Multiply top and bottom so the bottom becomes 100.";var m=t.match(/(\d+)% of (\d+)/);
  if(m)return "Here: "+m[1]+"% of "+m[2]+" → "+({50:m[2]+" ÷ 2",25:m[2]+" ÷ 4",10:m[2]+" ÷ 10",1:m[2]+" ÷ 100"}[m[1]])+" = ?";return "The shaded/cents number IS the percent, because it's already out of 100.";}
 return "First step: "+q.hint.split("\n")[0];}

// ===== Professor Hoot walkthroughs: steps {t:text, eq:[arithmetic "lhs = rhs"], vis} =====
function nf(x){x=r2(x);return String(x);}
function walkPercent(q){var v=q.v,S=[],T=q.type,tip,ans;function st(t,eq,vis){S.push({t:t,eq:eq||[],vis:vis||null});}
 if(T==="e0"){st("Percent means \"out of 100\". This grid has exactly 100 squares, so every square is 1%.",["100 ÷ 100 = 1"],{grid:v.k});
  st("Count the shaded squares: "+v.k+". That's "+v.k+" out of 100.",[v.k+" × 1 = "+v.k],{grid:v.k});ans=v.k;st("So "+v.k+" out of 100 = "+v.k+"%.",[],{grid:v.k});tip="When something is already out of 100, the count IS the percent!";}
 else if(T==="e1"){var p=v.p,n=v.n,a=n*p/100;
  if(p===50){st("50% is a benchmark: it means HALF.",[],{bar:[[50,"50%"]]});st("Half of "+n+": divide by 2.",[n+" ÷ 2 = "+nf(a)],{bar:[[50,nf(a)]],tot:n});}
  else if(p===25){st("25% is a benchmark: it's half of half (a quarter).",[],{bar:[[25,"25%"]]});st("First find 50% (half).",[n+" ÷ 2 = "+nf(n/2)],{bar:[[50,nf(n/2)]],tot:n});st("Then half again gives 25%.",[nf(n/2)+" ÷ 2 = "+nf(a)],{bar:[[25,nf(a)]],tot:n});}
  else if(p===10){st("10% is a benchmark: it's 1 out of every 10. Move the decimal one place left.",[],{bar:[[10,"10%"]]});st("10% of "+n+":",[n+" ÷ 10 = "+nf(a)],{bar:[[10,nf(a)]],tot:n});}
  else{st("1% is a benchmark: 1 out of every 100. Move the decimal two places left.",[],{grid:1});st("1% of "+n+":",[n+" ÷ 100 = "+nf(a)]);}
  ans=a;st("So "+p+"% of "+n+" = "+nf(a)+".",[]);tip="Benchmarks: 50% = ÷2 · 25% = ÷4 · 10% = ÷10 · 1% = ÷100.";}
 else if(T==="e2"){st("A dollar is 100 cents — so a dollar is already \"out of 100\".",["100 ÷ 100 = 1"],{grid:v.c});st(v.c+"% means "+v.c+" out of 100 cents.",[v.c+" × 1 = "+v.c],{grid:v.c});ans=v.c;st("So "+v.c+"% of a dollar is "+v.c+" cents.",[]);tip="Percent of a dollar = that many cents. 25% = 25¢!";}
 else if(T==="e3"){var m=100/v.b;st("Percent means out of 100. We want the bottom of "+v.a+"/"+v.b+" to become 100.",[]);
  st("What times "+v.b+" makes 100?",["100 ÷ "+v.b+" = "+nf(m)]);st("Multiply the top AND bottom by "+nf(m)+".",[v.a+" × "+nf(m)+" = "+v.p,v.b+" × "+nf(m)+" = 100"],{grid:v.p});ans=v.p;st(v.a+"/"+v.b+" = "+v.p+"/100 = "+v.p+"%.",[],{grid:v.p});tip="Make the bottom 100 and the top is your percent.";}
 else if(T==="m0"){var p=v.p,n=v.n,ten=n/10,a=p*n/100;st("part = percent × whole. Let's build "+p+"% from 10% pieces.",[]);

  else if(p===15)st("15% = 10% + 5%. 5% is half of 10%.",[nf(ten)+" ÷ 2 = "+nf(ten/2),nf(ten)+" + "+nf(ten/2)+" = "+nf(a)],{bar:[[10,nf(ten)],[5,nf(ten/2)]],tot:n});
  else if(p===75)st("75% = 50% + 25%. Half, plus half of half.",[n+" ÷ 2 = "+nf(n/2),n+" ÷ 4 = "+nf(n/4),nf(n/2)+" + "+nf(n/4)+" = "+nf(a)],{bar:[[50,nf(n/2)],[25,nf(n/4)]],tot:n});
  else st(p+"% is "+(p/10)+" pieces of 10%.",[nf(ten)+" × "+(p/10)+" = "+nf(a)],{bar:[[p,nf(a)]],tot:n});

 "<div class='note'>🦉 <b>Professor Hoot</b> can show you step by step how to solve any kind of question.<br><button class='btn g' id='showme' onclick='hootPick()'>Show me how</button> <button class='btn' id='hoottog' onclick='hootToggle()'>Hoot's help offers: "+(save.hoot.on?"On":"Off")+"</button></div>"+BACK);}
function stats(){openParent();}
function openParent(){if(!PROF||!save)return;parentOK=0;
 if(save.pin&&save.pin.set&&save.pin.h){pinPend=null;return pinAskUI("parent");}
 pinBuf="";pinStep={k:"new",first:null,setup:false,parent:true};pinRedraw();}
function supportGame(){if(!parentOK)return;window.open(TIP_JAR_URL,"_blank","noopener,noreferrer");}
function sendSuggestion(){if(!parentOK)return;var a=document.createElement("a");a.href=suggestionMail().href;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}
function parentDash(){if(!parentOK)return openParent();
 var skills=activeSkills(save),weak=weakSkills(save);
 var h="<h3>📊 Parent dashboard — "+esc(pname())+"</h3>";
 h+="<div class='note'><b>"+esc(gradeLabel(save.grade==null?0:save.grade))+"</b> · Level "+save.level+" · XP "+save.xp+"/"+need()+" · ⭐ "+save.pts+" · Tests "+save.tests.passed+"/"+save.tests.taken+" passed";
 h+="<br>Extra lessons: "+(save.extras&&save.extras.length?save.extras.map(skillName).map(esc).join(", "):"none")+"</div>";
 h+="<p><button class='btn y' id='tipjar' onclick='supportGame()'>Support the game</button> <button class='btn b' id='suggestions' onclick='sendSuggestion()'>Suggestions</button></p>";
 h+="<div class='note' style='font-size:14px'>Support opens a new tab. Suggestions opens your email app with a short note that includes Math for Fun "+esc(APP_VERSION)+" and no child data. Both stay behind this PIN.</div>";
 if(weak.length){h+="<div class='hint'><b>Skills to practice</b><ul>";weak.forEach(function(w){h+="<li>"+esc(w.name)+" — "+(w.n?w.n+" answered, "+Math.round(w.acc*100)+"% correct":"extra help is on")+"</li>";});h+="</ul></div>";}
 else h+="<div class='note'>No weak skills right now. A skill is marked weak under 60% after 3 or more tries, or while extra help is turned on.</div>";
 h+="<b>Progress by skill</b><table class='t'><tr><th>Skill</th><th>Standard</th><th>Answered</th><th>Correct</th><th>Accuracy</th><th>Recent days</th></tr>";
 skills.forEach(function(s){var p=skillProgress(save,s.id);var days=!p.days.length?"–":p.days.map(function(x){var b=x.d.split("-");return b[1]+"/"+b[2]+" "+x.c+"/"+x.n;}).join(" · ");
  h+="<tr class='"+(p.weak?"weak":"")+"'><td>"+(p.weak?"⚠️ ":"")+esc(p.name)+"</td><td>"+esc(p.standard)+"</td><td>"+p.n+"</td><td>"+p.c+"</td><td>"+(p.n?Math.round(100*p.acc)+"%":"–")+"</td><td>"+esc(days)+"</td></tr>";});
 h+="</table>";
 var s=save.stats;h+="<b>By difficulty</b><table class='t'><tr><th>Level</th><th>Answered</th><th>Correct</th><th>Accuracy</th></tr>";
 ["easy","medium","hard"].forEach(function(d){h+="<tr><td>"+d+"</td><td>"+s[d][0]+"</td><td>"+s[d][1]+"</td><td>"+(s[d][0]?Math.round(100*s[d][1]/s[d][0])+"%":"–")+"</td></tr>";});
 h+="</table><div class='note'>Fish "+(save.caught.fish||0)+" · Bugs "+(save.caught.bug||0)+" · Login streak "+(save.gstreak||0)+" · Bonus deals "+(save.deals?save.deals.c+"/"+save.deals.n:"none yet")+"</div>";
 h+="<button class='btn' onclick='editGrade()'>Change grade</button> <button class='btn' onclick='editExtras()'>Edit extra lessons</button> <button class='btn b' id='gear' onclick='parentSettings()'>Shop PIN settings</button>";
 h+="<br><button class='btn' onclick='closeDlg()'>Close</button> <button class='btn r' onclick='if(confirm(\"Erase ALL progress for "+esc(pname())+"?\")){delProfileNoConfirm()}'>Reset progress</button>";
 panel(h);}
function editGrade(){if(!parentOK)return;var h="<h3>Grade for "+esc(pname())+"</h3><div class='note'>Core lessons switch immediately. Extra lessons that are no longer from a neighboring grade are removed.</div><div class='grid' style='justify-content:center'>";
 for(var g=0;g<=7;g++)h+="<button class='btn"+(save.grade===g?" g":"")+"' onclick='setPlayerGrade("+g+")'><b>"+gradeShort(g)+"</b><br><small>"+esc(gradeLabel(g))+"</small></button>";
 panel(h+"</div><button class='btn' onclick='parentDash()'>Back</button>");}
function setPlayerGrade(g){if(!parentOK)return;save.grade=g;save.extras=normalizeExtras(g,save.extras);var list=profList();list.forEach(function(p){if(p.id===PROF)p.grade=g;});saveProfList(list);store();parentDash();}
function neighborBlurb(g){var names=[];if(g>0)names.push(gradeLabel(g-1));if(g<7)names.push(gradeLabel(g+1));return names.length?names.join(" or "):"a neighboring grade";}
function editExtras(){if(!parentOK)return;pendExtras=(save.extras||[]).slice();renderParentExtras();}
function renderParentExtras(){if(!parentOK)return;
 var opts=adjacentSkills(save.grade),h="<h3>Extra lessons</h3><div class='note'>Up to 5 topics from "+esc(neighborBlurb(save.grade))+".</div><div class='grid'>";
 opts.forEach(function(s){var on=pendExtras.indexOf(s.id)>=0;h+="<button class='btn"+(on?" g":"")+"' onclick='toggleParentExtra(\""+s.id+"\")'>"+(on?"✓ ":"")+esc(s.name)+"<br><small>"+esc(gradeShort(s.grade))+" · "+esc(s.standard)+"</small></button>";});
 panel(h+"</div><div id='excount'>"+pendExtras.length+" of 5</div><button class='btn g' onclick='saveParentExtras()'>Save</button> <button class='btn' onclick='parentDash()'>Back</button>");}
function toggleParentExtra(id){if(!parentOK)return;var i=pendExtras.indexOf(id);if(i>=0)pendExtras.splice(i,1);else if(pendExtras.length<5)pendExtras.push(id);else{toast("Up to 5 extra lessons.");return;}renderParentExtras();}
function saveParentExtras(){if(!parentOK)return;save.extras=normalizeExtras(save.grade,pendExtras);store();parentDash();}

// ---------- input ----------
document.addEventListener("keydown",function(e){audioInit();if(AC&&AC.state==="suspended")AC.resume();var tg=e.target.tagName;
 if(tg==="INPUT"){if(e.key==="Escape")closeDlg();return;}
 var key=e.key.toLowerCase();
 if(open){if(e.key==="Escape"){closeDlg();return;}if(typing&&(e.key===" "||e.key==="Enter")){typing.done();e.preventDefault();return;}
  if(/^[1-4]$/.test(e.key)){var bs=dlg.querySelectorAll(".opt");if(bs[e.key-1]){bs[e.key-1].click();e.preventDefault();}}return;}
 keys[key]=1;
 if(e.key===" "||e.key==="Enter"){if(!e.repeat)act();e.preventDefault();}
 else if(key==="b")bagUI();else if(key==="t")cycleTool();else if(key==="p"||e.key==="Tab"){phone();e.preventDefault();}else if(key==="m")setMute(!muted);
 if(e.key.indexOf("Arrow")===0)e.preventDefault();});
document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=0;});
window.addEventListener("blur",function(){keys={};});
cv.addEventListener("pointerdown",function(e){if(e.button>0)return;if(e.cancelable)e.preventDefault();audioInit();if(AC&&AC.state==="suspended")AC.resume();if(open||fadeBusy)return;var wx=cam.x+e.clientX/zoom,wy=cam.y+e.clientY/zoom;
 if(fishing){reel();return;}
 if(scene==="island")for(var i=0;i<vill.length;i++){var v=vill[i];if(Math.hypot(wx-v.x,wy-(v.y-24))<26){if(Math.hypot(pl.x-v.x,pl.y-v.y)<46)talk(v);else{pl.tx=v.x;pl.ty=v.y+24;pl.goal=v;}return;}}
 if(Math.hypot(wx-pl.x,wy-(pl.y-18))<22){act();return;}
 pl.tx=wx;pl.ty=wy;pl.goal=null;});
document.getElementById("stb").onclick=stats;document.getElementById("prof").onclick=function(){if(!open)startScreen();};document.getElementById("bagb").onclick=function(){bagUI()};document.getElementById("phoneb").onclick=phone;document.getElementById("mute").onclick=function(){audioInit();setMute(!muted)};
document.getElementById("pts").onclick=function(){shopHint()};
function shopHint(){toast("Spend ⭐ at Tilly's Shop (green awning by the plaza)!");}
document.getElementById("lvl").onclick=function(){panel("<h3>🌟 Level "+save.level+"</h3>XP: "+save.xp+" / "+need()+"<br>"+(ready()?"Your XP bar is full! Visit <b>Professor Hoot</b> (purple dome, north of the plaza) to take your Level-Up Test.":"Answer questions correctly to fill your XP bar. When it's full, Professor Hoot will give you a Level-Up Test!")+"<br><button class='btn' onclick='closeDlg()'>OK</button>");};
document.getElementById("phoneb").innerHTML="<svg viewBox='0 0 24 24'><rect x='6' y='2' width='12' height='20' rx='4' fill='#ff8fab'/><rect x='8' y='5' width='8' height='11' rx='2' fill='#fff4fb'/><circle cx='12' cy='19' r='1.2' fill='#fff'/></svg> Phone";
// ---------- loop ----------
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);zoom=curZoom();updCam(0,true);}
window.addEventListener("resize",resize);
var last=performance.now();
var growT=0,crackT=0;
function update(dt){gt+=dt;growT-=dt;if(growT<=0){growT=1;growPlots();}if(scene==="house"&&curRoom().some(function(f){return nm(f.e)==="Fireplace"&&fireOn(f);})){crackT-=dt;if(crackT<=0){crackT=.12+Math.random()*.5;sfx("crackle");}}updPlayer(dt);hootTick(dt);if(scene==="island")vill.forEach(function(v){updVill(v,dt);});spawnBugs(dt);updBugs(dt);updFishing(dt);updSwing(dt);updDrops(dt);TREES.forEach(function(t){if(t.shake>0)t.shake-=dt;});updParts(dt);updCam(dt);}
function loop(now){var dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);render();}catch(err){console.error(err);}requestAnimationFrame(loop);}
prerender();save=loadSave("mi_none");rebuildColliders();resize();store();updMute();updClock();setInterval(updClock,1000);requestAnimationFrame(loop);startScreen();
</script></body></html>
